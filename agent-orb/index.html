<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent Orb">
<meta name="theme-color" content="#05060a">
<title>Resonance · Agent Orb — a listening AI voice visualiser</title>
<style>
  :root {
    /* ---- Brand-themeable tokens ---- */
    --bg-0:   #05060a;
    --ink:    #e7e9f5;
    --ink-dim:#8b8fb0;
    --ink-faint:#4a4d68;
    --panel:  rgba(18, 20, 34, 0.55);
    --panel-brd: rgba(140, 150, 210, 0.16);
    --chip:   rgba(255,255,255,0.05);
    --chip-brd: rgba(255,255,255,0.09);
    --focus:  #8ea2ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% 30%, rgba(60,70,150,0.08) 0%, rgba(10,12,24,0) 55%),
      radial-gradient(140% 130% at 50% 120%, #0a0c18 0%, var(--bg-0) 60%),
      var(--bg-0);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#orb { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .wordmark { position: absolute; top: clamp(20px,4vw,40px); left: clamp(20px,5vw,44px); }
  .wordmark h1 { font-size: clamp(18px,2.4vw,26px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; display: flex; align-items: center; gap: 0.5ch; }
  .wordmark h1 .dot { width: 0.38em; height: 0.38em; border-radius: 50%; background: var(--live-col, #8ea2ff); box-shadow: 0 0 12px var(--live-col, #8ea2ff); transition: background .4s, box-shadow .4s; }
  .wordmark p { margin-top: 8px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); }

  .status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, calc(-50% + var(--orb-r, 150px) + 46px)); text-align: center; transition: transform .3s; }
  .status .state { font-size: clamp(20px,3.4vw,30px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .status .hint { margin-top: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); min-height: 1em; }

  .console { position: absolute; left: 50%; bottom: clamp(22px, 5vh, 46px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 16px; pointer-events: auto; width: min(560px, 92vw); }
  .segmented { display: flex; gap: 6px; padding: 6px; border-radius: 18px; background: var(--panel); border: 1px solid var(--panel-brd); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); width: 100%; }
  .seg { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 11px 4px 9px; border-radius: 13px; background: transparent; border: 1px solid transparent; color: var(--ink-dim); font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; transition: background .18s, color .18s, border-color .18s; }
  .seg .ic { width: 20px; height: 20px; flex: none; }
  .seg .ic path, .seg .ic line, .seg .ic circle, .seg .ic rect { stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .seg:hover { color: var(--ink); }
  .seg[aria-pressed="true"] { background: var(--chip); border-color: var(--chip-brd); color: var(--ink); }
  .seg:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .microw { display: flex; align-items: center; gap: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--ink-dim); }
  .micdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); transition: background .3s, box-shadow .3s; }
  .micdot.on { background: #62e4a8; box-shadow: 0 0 10px #62e4a8; }
  .micdot.err { background: #ff6b7d; box-shadow: 0 0 10px #ff6b7d; }

  .gate { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(5,6,10,0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); pointer-events: auto; }
  .gate button { pointer-events: auto; padding: 16px 30px; border-radius: 16px; background: var(--panel); border: 1px solid var(--panel-brd); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: var(--ink); font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .gate button .ic { width: 20px; height: 20px; }
  .gate button .ic path { stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; fill: none; }
  .gate small { display: block; font-family: ui-monospace, Menlo, monospace; font-weight: 500; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 4px; }

  @media (max-width: 480px) {
    .seg .lbl { font-size: 11px; }
    .wordmark p { display: none; }
  }
</style>

<canvas id="orb"></canvas>

<div class="hud">
  <div class="wordmark">
    <h1><span class="dot"></span> Agent</h1>
    <p>Voice visualiser</p>
  </div>

  <div class="status">
    <div class="state" id="stateLabel">Idle</div>
    <div class="hint" id="stateHint">Tap a state below</div>
  </div>

  <div class="console">
    <div class="segmented" role="group" aria-label="Agent state">
      <button class="seg" data-state="idle" aria-pressed="true">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>
        <span class="lbl">Idle</span>
      </button>
      <button class="seg" data-state="listening" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span class="lbl">Listening</span>
      </button>
      <button class="seg" data-state="thinking" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>
        <span class="lbl">Thinking</span>
      </button>
      <button class="seg" data-state="speaking" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24"><line x1="5" y1="9" x2="5" y2="15"/><line x1="9.5" y1="5" x2="9.5" y2="19"/><line x1="14.5" y1="7" x2="14.5" y2="17"/><line x1="19" y1="10" x2="19" y2="14"/></svg>
        <span class="lbl">Speaking</span>
      </button>
    </div>
    <div class="microw">
      <span class="micdot" id="micDot"></span>
      <span id="micLabel">Microphone off · used only in Listening</span>
    </div>
  </div>
</div>

<div class="gate" id="gate">
  <button id="gateBtn">
    <svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <span>Start visualiser<small>Enable sound &amp; motion</small></span>
  </button>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('orb');
  const ctx = canvas.getContext('2d', { alpha: true });

  // ---------- States: each defines the INTERNAL colour pattern + behaviour ----
  // The glass sphere itself never changes shape — only the pattern inside reacts.
  const STATES = {
    idle:      { name:'Idle',      hint:'Waiting for you',
                 inner:[[70,150,255],[50,110,235],[120,180,255]],
                 swirl:0.14, spread:0.34, drive:0.0 },
    listening: { name:'Listening', hint:'Speak — the pattern reacts to your voice',
                 inner:[[70,205,255],[60,150,255],[130,240,235]],
                 swirl:0.30, spread:0.40, drive:1.0 },
    thinking:  { name:'Thinking',  hint:'Processing',
                 inner:[[165,115,255],[120,110,255],[220,120,235]],
                 swirl:1.05, spread:0.30, drive:0.0 },
    speaking:  { name:'Speaking',  hint:'Agent is responding',
                 inner:[[95,235,205],[80,195,255],[140,150,255]],
                 swirl:0.42, spread:0.38, drive:0.85 }
  };

  let state = 'idle';
  // Eased parameters for smooth transitions between states
  const P = {
    inner:[[70,150,255],[50,110,235],[120,180,255]],
    swirl:0.14, spread:0.34, drive:0, level:0
  };

  // ---------- Sizing ---------------------------------------------------------
  let W=0, H=0, cx=0, cy=0, baseR=0, dpr=1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W/2; cy = H/2 - Math.min(H*0.06, 40);
    baseR = Math.max(70, Math.min(W, H) * 0.21);
    document.documentElement.style.setProperty('--orb-r', baseR + 'px');
    seedBubbles();
  }
  window.addEventListener('resize', resize);

  // ---------- Frozen bubbles inside the glass (like the real marble) ----------
  let bubbles=[];
  function seedBubbles(){
    let s=42; const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
    bubbles=[];
    const n=10;
    for(let i=0;i<n;i++){
      // random point inside a disk, biased toward centre
      const a=rnd()*Math.PI*2, d=Math.sqrt(rnd())*0.72;
      bubbles.push({ nx:Math.cos(a)*d, ny:Math.sin(a)*d, r:0.006+rnd()*0.02, ph:rnd()*6.28 });
    }
  }
  resize();

  // ---------- Audio (real microphone) ---------------------------------------
  let audioCtx=null, analyser=null, timeData=null, micReady=false, micStream=null;
  const micDot=document.getElementById('micDot'), micLabel=document.getElementById('micLabel');

  async function enableMic(){
    if (micReady) return true;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }
      });
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.82;
      src.connect(analyser);
      timeData = new Uint8Array(analyser.fftSize);
      micReady = true;
      micDot.classList.add('on'); micDot.classList.remove('err');
      micLabel.textContent = 'Microphone live';
      return true;
    } catch(err){
      micDot.classList.add('err');
      micLabel.textContent = (location.protocol==='https:'||location.hostname==='localhost')
        ? 'Microphone blocked — allow access to react to voice'
        : 'Microphone needs https — open the hosted link';
      return false;
    }
  }
  function micLevel(){
    if(!micReady||!analyser) return 0;
    analyser.getByteTimeDomainData(timeData);
    let sum=0;
    for(let i=0;i<timeData.length;i++){ const v=(timeData[i]-128)/128; sum+=v*v; }
    const rms = Math.sqrt(sum/timeData.length);
    return Math.min(1, rms*3.2);
  }

  // ---------- Simulated "speaking" envelope ---------------------------------
  let speakSeed = Math.random()*1000;
  function speakLevel(t){
    const syl = 0.5 + 0.5*Math.sin(t*30 + Math.sin(t*7)*2);
    const emph = 0.55 + 0.45*Math.sin(t*3.3 + speakSeed);
    const pause = smoothPulse(t*0.55 + speakSeed*0.3);
    return Math.max(0, syl*emph*pause);
  }
  function smoothPulse(x){
    const n = 0.5+0.5*Math.sin(x*6.28) + 0.3*Math.sin(x*15.1+1.7);
    return n > 0.35 ? 1 : Math.max(0.12, n/0.35);
  }

  // ---------- Helpers --------------------------------------------------------
  const lerp=(a,b,k)=>a+(b-a)*k;
  const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  const mix=(c,d,k)=>[lerp(c[0],d[0],k),lerp(c[1],d[1],k),lerp(c[2],d[2],k)];
  const WHITE=[255,255,255], INK=[8,10,26];

  // ---------- Render loop ----------------------------------------------------
  let t0=performance.now(), running=false, swirlPhase=0, lastNow=t0;

  function frame(now){
    if(!running) return;
    const t=(now-t0)/1000;
    const dt=Math.min(0.05,(now-lastNow)/1000); lastNow=now;
    const S=STATES[state];

    // ease params toward the active state
    const k=0.06;
    for(let i=0;i<3;i++) P.inner[i]=mix(P.inner[i],S.inner[i],k);
    P.swirl=lerp(P.swirl,S.swirl,k);
    P.spread=lerp(P.spread,S.spread,k);
    P.drive=lerp(P.drive,S.drive,k);

    // reactive level: mic (listening) / synth (speaking) / none
    let target=0;
    if(state==='listening') target=micLevel();
    else if(state==='speaking') target=speakLevel(t);
    P.level=lerp(P.level,target, target>P.level?0.35:0.12);
    const drive=P.level*P.drive;

    swirlPhase += dt*P.swirl*(1+drive*0.8);

    const prim=P.inner[0];
    document.documentElement.style.setProperty('--live-col', rgba(prim,1));

    ctx.clearRect(0,0,W,H);
    const R=baseR;                 // fixed radius — the marble holds its shape

    // 1) ambient coloured halo cast by the glass
    const halo=ctx.createRadialGradient(cx,cy,R*0.55, cx,cy,R*1.75);
    halo.addColorStop(0, rgba(prim, 0.16+drive*0.20));
    halo.addColorStop(1, rgba(prim, 0));
    ctx.fillStyle=halo;
    ctx.beginPath(); ctx.arc(cx,cy,R*1.75,0,Math.PI*2); ctx.fill();

    // 2) contact shadow beneath
    const sh=ctx.createRadialGradient(cx,cy+R*1.02,R*0.1, cx,cy+R*1.02,R*0.9);
    sh.addColorStop(0,'rgba(0,0,0,0.38)'); sh.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sh; ctx.beginPath(); ctx.ellipse(cx,cy+R*1.02,R*0.85,R*0.22,0,0,Math.PI*2); ctx.fill();

    // ================= INSIDE THE GLASS (clipped to circle) ==================
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();

    // 2a) glass body volume — deep tint at the rim, luminous toward the light
    const lx=cx-R*0.28, ly=cy-R*0.32;
    const glassLight=mix(prim,WHITE,0.55), glassMid=mix(prim,INK,0.35), glassDeep=mix(prim,INK,0.72);
    const body=ctx.createRadialGradient(lx,ly,R*0.05, cx,cy,R*1.15);
    body.addColorStop(0, rgba(glassLight,1));
    body.addColorStop(0.45, rgba(glassMid,1));
    body.addColorStop(1, rgba(glassDeep,1));
    ctx.fillStyle=body; ctx.fillRect(cx-R,cy-R,2*R,2*R);

    // 2b) internal colour shapes — the pattern that swirls & reacts
    ctx.globalCompositeOperation='screen';
    const N=5;
    for(let i=0;i<N;i++){
      const ang=swirlPhase*(1+i*0.15) + i*(Math.PI*2/N);
      const orbit=R*(P.spread*(0.5+i*0.14) )*(1+drive*0.35);
      const wob=Math.sin(t*(0.6+i*0.3)+i);
      const x=cx+Math.cos(ang)*orbit;
      const y=cy+Math.sin(ang*1.08+wob*0.4)*orbit*0.9;
      const rad=R*(0.60-i*0.07)*(1+drive*0.30);
      const c=P.inner[i%3];
      const g=ctx.createRadialGradient(x,y,0,x,y,rad);
      g.addColorStop(0, rgba(mix(c,WHITE,0.15), 0.55+drive*0.18));
      g.addColorStop(0.6, rgba(c, 0.22));
      g.addColorStop(1, rgba(c,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
    }

    // 2c) refracted light ribbon curving through the glass
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(Math.sin(t*0.25)*0.5 + swirlPhase*0.15);
    const rib=ctx.createLinearGradient(-R,0,R,0);
    const ribC=mix(prim,WHITE,0.7);
    rib.addColorStop(0, rgba(ribC,0)); rib.addColorStop(0.5, rgba(ribC,0.42+drive*0.2)); rib.addColorStop(1, rgba(ribC,0));
    ctx.fillStyle=rib;
    ctx.beginPath(); ctx.ellipse(0, R*0.12, R*0.92, R*0.16, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation='source-over';

    // 2d) frozen bubbles
    for(const b of bubbles){
      const x=cx+b.nx*R, y=cy+b.ny*R, r=b.r*R*(1+0.06*Math.sin(t*2+b.ph));
      const bg=ctx.createRadialGradient(x-r*0.3,y-r*0.3,0,x,y,r);
      bg.addColorStop(0,'rgba(255,255,255,0.9)');
      bg.addColorStop(0.4,'rgba(255,255,255,0.15)');
      bg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(20,30,60,0.35)'; ctx.lineWidth=Math.max(0.5,r*0.18);
      ctx.beginPath(); ctx.arc(x,y+r*0.15,r*0.9,0.15,Math.PI-0.15); ctx.stroke();
    }

    // 2e) inner rim darkening — gives glass thickness / depth
    const inrim=ctx.createRadialGradient(cx,cy,R*0.62, cx,cy,R);
    inrim.addColorStop(0,'rgba(0,0,20,0)');
    inrim.addColorStop(0.82,'rgba(0,0,25,0.05)');
    inrim.addColorStop(1, rgba(glassDeep,0.85));
    ctx.fillStyle=inrim; ctx.fillRect(cx-R,cy-R,2*R,2*R);

    // 2f) big soft glass reflection (top-left)
    ctx.globalCompositeOperation='lighter';
    ctx.save();
    ctx.translate(cx-R*0.34, cy-R*0.40); ctx.rotate(-0.6);
    const hl=ctx.createRadialGradient(0,0,0,0,0,R*0.62);
    hl.addColorStop(0,'rgba(255,255,255,0.55)');
    hl.addColorStop(0.5,'rgba(255,255,255,0.10)');
    hl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hl; ctx.beginPath(); ctx.ellipse(0,0,R*0.42,R*0.62,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation='source-over';

    ctx.restore(); // ============ end clip ============

    // 3) crisp specular hot-spot (sits on the glass surface)
    const spx=cx-R*0.40, spy=cy-R*0.46;
    const spec=ctx.createRadialGradient(spx,spy,0,spx,spy,R*0.14);
    spec.addColorStop(0,'rgba(255,255,255,0.95)');
    spec.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=spec; ctx.beginPath(); ctx.arc(spx,spy,R*0.14,0,Math.PI*2); ctx.fill();

    // 4) bottom-right rim light (light wrapping the sphere)
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
    const rimx=cx+R*0.5, rimy=cy+R*0.55;
    const rl=ctx.createRadialGradient(rimx,rimy,R*0.5, rimx,rimy,R*0.98);
    rl.addColorStop(0,'rgba(255,255,255,0)');
    rl.addColorStop(0.75, rgba(mix(prim,WHITE,0.6),0.0));
    rl.addColorStop(1, rgba(mix(prim,WHITE,0.75),0.55));
    ctx.fillStyle=rl; ctx.fillRect(cx-R,cy-R,2*R,2*R);
    ctx.restore();

    // 5) thin bright fresnel edge
    ctx.lineWidth=Math.max(1,R*0.015);
    ctx.strokeStyle=rgba(mix(prim,WHITE,0.75),0.45);
    ctx.beginPath(); ctx.arc(cx,cy,R-ctx.lineWidth*0.5,0,Math.PI*2); ctx.stroke();

    requestAnimationFrame(frame);
  }

  // ---------- State switching ------------------------------------------------
  const stateLabel=document.getElementById('stateLabel');
  const stateHint=document.getElementById('stateHint');
  const segs=[...document.querySelectorAll('.seg')];

  async function setState(next){
    state=next;
    const S=STATES[next];
    stateLabel.textContent=S.name;
    stateHint.textContent=S.hint;
    segs.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.state===next)));
    if(next==='speaking') speakSeed=Math.random()*1000;
    if(next==='listening'){
      const ok=await enableMic();
      if(ok && audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      if(!ok) stateHint.textContent=micLabel.textContent;
    }
  }
  segs.forEach(b=>b.addEventListener('click',()=>setState(b.dataset.state)));

  // ---------- Start gate -----------------------------------------------------
  const gate=document.getElementById('gate');
  document.getElementById('gateBtn').addEventListener('click',()=>{
    gate.style.display='none';
    running=true; t0=performance.now(); lastNow=t0;
    requestAnimationFrame(frame);
  });

  window.addEventListener('keydown',e=>{
    const map={'1':'idle','2':'listening','3':'thinking','4':'speaking'};
    if(map[e.key]) setState(map[e.key]);
  });
})();
</script>
