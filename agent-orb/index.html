<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent Orb">
<meta name="theme-color" content="#05060a">
<title>Resonance · Agent Orb — a listening AI voice visualiser</title>
<style>
  :root {
    /* ---- Brand-themeable tokens: swap these to rebrand the orb ---- */
    --bg-0:   #05060a;
    --ink:    #e7e9f5;
    --ink-dim:#8b8fb0;
    --ink-faint:#4a4d68;
    --panel:  rgba(18, 20, 34, 0.55);
    --panel-brd: rgba(140, 150, 210, 0.16);
    --chip:   rgba(255,255,255,0.05);
    --chip-brd: rgba(255,255,255,0.09);
    --focus:  #8ea2ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% 30%, rgba(70,80,180,0.10) 0%, rgba(10,12,24,0) 55%),
      radial-gradient(140% 130% at 50% 120%, #0a0c18 0%, var(--bg-0) 60%),
      var(--bg-0);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#orb { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  /* Wordmark */
  .wordmark { position: absolute; top: clamp(20px,4vw,40px); left: clamp(20px,5vw,44px); }
  .wordmark h1 { font-size: clamp(18px,2.4vw,26px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; display: flex; align-items: center; gap: 0.5ch; }
  .wordmark h1 .dot { width: 0.38em; height: 0.38em; border-radius: 50%; background: var(--live-col, #8ea2ff); box-shadow: 0 0 12px var(--live-col, #8ea2ff); transition: background .4s, box-shadow .4s; }
  .wordmark p { margin-top: 8px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); }

  /* Center status caption under the orb */
  .status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, calc(-50% + var(--orb-r, 150px) + 42px)); text-align: center; transition: transform .3s; }
  .status .state { font-size: clamp(20px,3.4vw,30px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .status .hint { margin-top: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); min-height: 1em; }

  /* Bottom console */
  .console { position: absolute; left: 50%; bottom: clamp(22px, 5vh, 46px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 16px; pointer-events: auto; width: min(560px, 92vw); }
  .segmented { display: flex; gap: 6px; padding: 6px; border-radius: 18px; background: var(--panel); border: 1px solid var(--panel-brd); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); width: 100%; }
  .seg { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 11px 4px 9px; border-radius: 13px; background: transparent; border: 1px solid transparent; color: var(--ink-dim); font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; transition: background .18s, color .18s, border-color .18s; }
  .seg .ic { width: 20px; height: 20px; flex: none; }
  .seg .ic path, .seg .ic line, .seg .ic circle, .seg .ic rect { stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .seg:hover { color: var(--ink); }
  .seg[aria-pressed="true"] { background: var(--chip); border-color: var(--chip-brd); color: var(--ink); }
  .seg:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .microw { display: flex; align-items: center; gap: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--ink-dim); }
  .micdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); transition: background .3s, box-shadow .3s; }
  .micdot.on { background: #62e4a8; box-shadow: 0 0 10px #62e4a8; }
  .micdot.err { background: #ff6b7d; box-shadow: 0 0 10px #ff6b7d; }

  /* first-run gate for autoplay/mic on mobile */
  .gate { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(5,6,10,0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); pointer-events: auto; }
  .gate button { pointer-events: auto; padding: 16px 30px; border-radius: 16px; background: var(--panel); border: 1px solid var(--panel-brd); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: var(--ink); font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .gate button .ic { width: 20px; height: 20px; }
  .gate button .ic path, .gate button .ic line, .gate button .ic rect { stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; fill: none; }
  .gate small { display: block; font-family: ui-monospace, Menlo, monospace; font-weight: 500; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 4px; }

  @media (max-width: 480px) {
    .seg .lbl { font-size: 11px; }
    .wordmark p { display: none; }
  }
</style>

<canvas id="orb"></canvas>

<div class="hud">
  <div class="wordmark">
    <h1><span class="dot"></span> Agent</h1>
    <p>Voice visualiser</p>
  </div>

  <div class="status">
    <div class="state" id="stateLabel">Idle</div>
    <div class="hint" id="stateHint">Tap a state below</div>
  </div>

  <div class="console">
    <div class="segmented" role="group" aria-label="Agent state">
      <button class="seg" data-state="idle" aria-pressed="true">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>
        <span class="lbl">Idle</span>
      </button>
      <button class="seg" data-state="listening" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span class="lbl">Listening</span>
      </button>
      <button class="seg" data-state="thinking" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>
        <span class="lbl">Thinking</span>
      </button>
      <button class="seg" data-state="speaking" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24"><line x1="5" y1="9" x2="5" y2="15"/><line x1="9.5" y1="5" x2="9.5" y2="19"/><line x1="14.5" y1="7" x2="14.5" y2="17"/><line x1="19" y1="10" x2="19" y2="14"/></svg>
        <span class="lbl">Speaking</span>
      </button>
    </div>
    <div class="microw">
      <span class="micdot" id="micDot"></span>
      <span id="micLabel">Microphone off · used only in Listening</span>
    </div>
  </div>
</div>

<div class="gate" id="gate">
  <button id="gateBtn">
    <svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <span>Start visualiser<small>Enable sound &amp; motion</small></span>
  </button>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('orb');
  const ctx = canvas.getContext('2d', { alpha: true });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- State palettes -------------------------------------------------
  // Each state defines the flowing-orb colour trio, glow colour and behaviour.
  const STATES = {
    idle:      { name:'Idle',      hint:'Waiting for you',
                 cols:[[120,140,255],[90,110,220],[150,120,255]], glow:[120,140,255],
                 breathe:0.06, wobble:0.05, spin:0.04, drive:0.0 },
    listening: { name:'Listening', hint:'Speak — the orb reacts to your voice',
                 cols:[[90,200,255],[70,160,255],[120,240,220]], glow:[110,210,255],
                 breathe:0.05, wobble:0.10, spin:0.10, drive:1.0 },
    thinking:  { name:'Thinking',  hint:'Processing',
                 cols:[[170,120,255],[120,110,255],[220,120,230]], glow:[180,130,255],
                 breathe:0.05, wobble:0.14, spin:0.55, drive:0.0 },
    speaking:  { name:'Speaking',  hint:'Agent is responding',
                 cols:[[120,240,200],[90,200,255],[150,150,255]], glow:[120,235,210],
                 breathe:0.06, wobble:0.10, spin:0.16, drive:0.85 }
  };

  let state = 'idle';
  // animated (eased) params so state changes feel smooth
  const P = { r:0, g:0, b:0, glowR:0, glowG:0, glowB:0, breathe:0.06, wobble:0.05, spin:0.04, drive:0, level:0, live:0 };
  // init to idle colours
  P.r=STATES.idle.cols[0][0]; P.g=STATES.idle.cols[0][1]; P.b=STATES.idle.cols[0][2];
  P.glowR=STATES.idle.glow[0]; P.glowG=STATES.idle.glow[1]; P.glowB=STATES.idle.glow[2];

  // ---------- Sizing ---------------------------------------------------------
  let W=0, H=0, cx=0, cy=0, baseR=0, dpr=1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W/2; cy = H/2 - Math.min(H*0.06, 40);
    baseR = Math.max(64, Math.min(W, H) * 0.20);
    document.documentElement.style.setProperty('--orb-r', baseR + 'px');
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Audio (real microphone) ---------------------------------------
  let audioCtx=null, analyser=null, timeData=null, micReady=false, micStream=null;
  const micDot=document.getElementById('micDot'), micLabel=document.getElementById('micLabel');

  async function enableMic(){
    if (micReady) return true;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }
      });
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.82;
      src.connect(analyser);
      timeData = new Uint8Array(analyser.fftSize);
      micReady = true;
      micDot.classList.add('on'); micDot.classList.remove('err');
      micLabel.textContent = 'Microphone live';
      return true;
    } catch(err){
      micDot.classList.add('err');
      micLabel.textContent = (location.protocol==='https:'||location.hostname==='localhost')
        ? 'Microphone blocked — allow access to react to voice'
        : 'Microphone needs https — open the hosted link';
      return false;
    }
  }
  function micLevel(){
    if(!micReady||!analyser) return 0;
    analyser.getByteTimeDomainData(timeData);
    let sum=0;
    for(let i=0;i<timeData.length;i++){ const v=(timeData[i]-128)/128; sum+=v*v; }
    const rms = Math.sqrt(sum/timeData.length);        // 0..~0.5 typical speech
    return Math.min(1, rms*3.2);                        // scale to a usable 0..1
  }

  // ---------- Simulated "speaking" envelope ---------------------------------
  // No real TTS in a prototype, so we synthesise a natural speech-like envelope:
  // syllable bursts (~4-6 Hz) with random emphasis and occasional short pauses.
  let speakSeed = Math.random()*1000;
  function speakLevel(t){
    const syl = 0.5 + 0.5*Math.sin(t*30 + Math.sin(t*7)*2);   // syllable rhythm
    const emph = 0.55 + 0.45*Math.sin(t*3.3 + speakSeed);      // phrase emphasis
    const pause = smoothPulse(t*0.55 + speakSeed*0.3);         // breathing pauses
    return Math.max(0, syl*emph*pause);
  }
  // returns ~1 most of the time, dipping toward 0 for brief pauses
  function smoothPulse(x){
    const n = 0.5+0.5*Math.sin(x*6.28) + 0.3*Math.sin(x*15.1+1.7);
    return n > 0.35 ? 1 : Math.max(0.12, n/0.35);
  }

  // ---------- Blob geometry --------------------------------------------------
  function blobPath(r, amp, seedPhase, t, spin){
    const pts = 150;
    const path = new Path2D();
    for(let i=0;i<=pts;i++){
      const a = (i/pts)*Math.PI*2 + spin;
      const w =
        0.55*Math.sin(a*3 + t*0.7  + seedPhase) +
        0.30*Math.sin(a*5 - t*1.05 + seedPhase*1.7) +
        0.18*Math.sin(a*2 + t*0.45 + seedPhase*0.5) +
        0.12*Math.sin(a*7 - t*1.4);
      const rr = r * (1 + amp*w);
      const x = cx + Math.cos(a)*rr;
      const y = cy + Math.sin(a)*rr;
      if(i===0) path.moveTo(x,y); else path.lineTo(x,y);
    }
    path.closePath();
    return path;
  }

  // ---------- Render loop ----------------------------------------------------
  let t0 = performance.now(), running=false;
  function lerp(a,b,k){ return a + (b-a)*k; }

  function frame(now){
    if(!running) return;
    const t = (now - t0)/1000;
    const S = STATES[state];

    // ease colours & behaviour toward the active state
    const k = 0.06;
    P.r=lerp(P.r,S.cols[0][0],k); P.g=lerp(P.g,S.cols[0][1],k); P.b=lerp(P.b,S.cols[0][2],k);
    P.glowR=lerp(P.glowR,S.glow[0],k); P.glowG=lerp(P.glowG,S.glow[1],k); P.glowB=lerp(P.glowB,S.glow[2],k);
    P.breathe=lerp(P.breathe,S.breathe,k);
    P.wobble=lerp(P.wobble,S.wobble,k);
    P.spin=lerp(P.spin,S.spin,k);
    P.drive=lerp(P.drive,S.drive,k);

    // drive level: mic when listening, synth when speaking, else 0
    let target=0;
    if(state==='listening') target = micLevel();
    else if(state==='speaking') target = speakLevel(t);
    P.level = lerp(P.level, target, target>P.level?0.35:0.12); // fast attack, slow release
    const drive = P.level * P.drive;

    // reflect live activity on the wordmark dot
    P.live = lerp(P.live, (state==='listening'&&micReady)||state==='speaking'?1:0, 0.05);
    document.documentElement.style.setProperty('--live-col',
      `rgb(${P.glowR|0},${P.glowG|0},${P.glowB|0})`);

    // clear
    ctx.clearRect(0,0,W,H);

    const breath = 1 + Math.sin(t*1.1)*P.breathe;
    const R = baseR * breath * (1 + drive*0.42);
    const amp = P.wobble + drive*0.28;
    const spin = t*P.spin;

    // ---- outer glow ----
    const glowR = R*(1.9 + drive*0.6);
    const gGrad = ctx.createRadialGradient(cx,cy,R*0.2, cx,cy,glowR);
    const ga = 0.20 + drive*0.28;
    gGrad.addColorStop(0, `rgba(${P.glowR|0},${P.glowG|0},${P.glowB|0},${ga})`);
    gGrad.addColorStop(1, `rgba(${P.glowR|0},${P.glowG|0},${P.glowB|0},0)`);
    ctx.fillStyle=gGrad;
    ctx.beginPath(); ctx.arc(cx,cy,glowR,0,Math.PI*2); ctx.fill();

    // ---- orb body (wobbling blob) ----
    const body = blobPath(R, amp, 0, t, spin);
    const bodyGrad = ctx.createRadialGradient(cx-R*0.3, cy-R*0.35, R*0.1, cx, cy, R*1.1);
    bodyGrad.addColorStop(0, `rgba(${P.r|0},${P.g|0},${P.b|0},0.95)`);
    bodyGrad.addColorStop(1, `rgba(${(P.r*0.5)|0},${(P.g*0.5)|0},${(P.b*0.65)|0},0.9)`);
    ctx.fillStyle = bodyGrad;
    ctx.fill(body);

    // ---- inner flowing colour blobs (clipped to body) ----
    ctx.save();
    ctx.clip(body);
    ctx.globalCompositeOperation = 'lighter';
    const cols = S.cols;
    for(let i=0;i<3;i++){
      const ph = i*2.1;
      const ox = Math.cos(t*(0.35+i*0.16)+ph) * R*(0.42+drive*0.18);
      const oy = Math.sin(t*(0.30+i*0.19)+ph*1.3) * R*(0.42+drive*0.18);
      const rr = R*(0.85 - i*0.12);
      const c = cols[i%cols.length];
      const bg = ctx.createRadialGradient(cx+ox, cy+oy, 0, cx+ox, cy+oy, rr);
      bg.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${0.55})`);
      bg.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(cx+ox, cy+oy, rr, 0, Math.PI*2); ctx.fill();
    }
    // top sheen
    const sheen = ctx.createRadialGradient(cx-R*0.35, cy-R*0.5, 0, cx-R*0.35, cy-R*0.5, R*0.9);
    sheen.addColorStop(0,'rgba(255,255,255,0.30)');
    sheen.addColorStop(0.4,'rgba(255,255,255,0.05)');
    sheen.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = sheen;
    ctx.beginPath(); ctx.arc(cx-R*0.35, cy-R*0.5, R*0.9, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // ---- thinking: orbiting satellites for a distinct 'processing' read ----
    if(P.spin > 0.3){
      const strength = Math.min(1, (P.spin-0.3)/0.25);
      ctx.globalCompositeOperation='lighter';
      for(let i=0;i<3;i++){
        const a = t*1.6 + i*(Math.PI*2/3);
        const orbR = R*1.28;
        const x=cx+Math.cos(a)*orbR, y=cy+Math.sin(a)*orbR;
        const d = 4 + 3*Math.sin(t*4+i);
        const gg=ctx.createRadialGradient(x,y,0,x,y,d*3);
        gg.addColorStop(0,`rgba(${P.glowR|0},${P.glowG|0},${P.glowB|0},${0.9*strength})`);
        gg.addColorStop(1,`rgba(${P.glowR|0},${P.glowG|0},${P.glowB|0},0)`);
        ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,d*3,0,Math.PI*2); ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
    }

    requestAnimationFrame(frame);
  }

  // ---------- State switching ------------------------------------------------
  const stateLabel=document.getElementById('stateLabel');
  const stateHint=document.getElementById('stateHint');
  const segs=[...document.querySelectorAll('.seg')];

  async function setState(next){
    state = next;
    const S = STATES[next];
    stateLabel.textContent = S.name;
    stateHint.textContent = S.hint;
    segs.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.state===next)));
    if(next==='speaking') speakSeed = Math.random()*1000; // fresh phrasing each time
    if(next==='listening'){
      const ok = await enableMic();
      if(ok && audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      if(!ok) stateHint.textContent = micLabel.textContent;
    }
  }
  segs.forEach(b=> b.addEventListener('click', ()=> setState(b.dataset.state)));

  // ---------- Start gate (needed for audio/motion permission on mobile) ------
  const gate=document.getElementById('gate');
  document.getElementById('gateBtn').addEventListener('click', ()=>{
    gate.style.display='none';
    running=true; t0=performance.now();
    requestAnimationFrame(frame);
  });

  // keyboard shortcuts 1-4
  window.addEventListener('keydown', e=>{
    const map={'1':'idle','2':'listening','3':'thinking','4':'speaking'};
    if(map[e.key]) setState(map[e.key]);
  });
})();
</script>
