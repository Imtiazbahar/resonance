<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent Orb">
<meta name="theme-color" content="#05060a">
<title>Resonance · Agent Orb — a listening AI voice visualiser</title>
<style>
  :root {
    --bg-0:#05060a; --ink:#e7e9f5; --ink-dim:#8b8fb0; --ink-faint:#4a4d68;
    --panel:rgba(18,20,34,0.55); --panel-brd:rgba(140,150,210,0.16);
    --chip:rgba(255,255,255,0.05); --chip-brd:rgba(255,255,255,0.09); --focus:#8ea2ff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% 30%, rgba(60,70,150,0.08) 0%, rgba(10,12,24,0) 55%),
      radial-gradient(140% 130% at 50% 120%, #0a0c18 0%, var(--bg-0) 60%),
      var(--bg-0);
    color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  canvas#orb { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }
  .hud { position:fixed; inset:0; pointer-events:none; z-index:3; }
  .wordmark { position:absolute; top:clamp(20px,4vw,40px); left:clamp(20px,5vw,44px); }
  .wordmark h1 { font-size:clamp(18px,2.4vw,26px); font-weight:800; letter-spacing:-0.03em; line-height:1; display:flex; align-items:center; gap:0.5ch; }
  .wordmark h1 .dot { width:0.38em; height:0.38em; border-radius:50%; background:var(--live-col,#8ea2ff); box-shadow:0 0 12px var(--live-col,#8ea2ff); transition:background .4s, box-shadow .4s; }
  .wordmark p { margin-top:8px; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-dim); }
  .status { position:absolute; left:50%; top:50%; transform:translate(-50%,calc(-50% + var(--orb-r,150px) + 46px)); text-align:center; transition:transform .3s; }
  .status .state { font-size:clamp(20px,3.4vw,30px); font-weight:700; letter-spacing:-0.02em; line-height:1; }
  .status .hint { margin-top:10px; font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-dim); min-height:1em; }
  .console { position:absolute; left:50%; bottom:clamp(22px,5vh,46px); transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:16px; pointer-events:auto; width:min(560px,92vw); }
  .segmented { display:flex; gap:6px; padding:6px; border-radius:18px; background:var(--panel); border:1px solid var(--panel-brd); backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3); width:100%; }
  .seg { flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 4px 9px; border-radius:13px; background:transparent; border:1px solid transparent; color:var(--ink-dim); font-family:inherit; font-size:12px; font-weight:600; letter-spacing:-0.01em; cursor:pointer; transition:background .18s,color .18s,border-color .18s; }
  .seg .ic { width:20px; height:20px; flex:none; }
  .seg .ic path, .seg .ic line, .seg .ic circle, .seg .ic rect { stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; fill:none; }
  .seg:hover { color:var(--ink); }
  .seg[aria-pressed="true"] { background:var(--chip); border-color:var(--chip-brd); color:var(--ink); }
  .seg:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .microw { display:flex; align-items:center; gap:12px; font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:0.06em; color:var(--ink-dim); }
  .micdot { width:8px; height:8px; border-radius:50%; background:var(--ink-faint); transition:background .3s,box-shadow .3s; }
  .micdot.on { background:#62e4a8; box-shadow:0 0 10px #62e4a8; }
  .micdot.err { background:#ff6b7d; box-shadow:0 0 10px #ff6b7d; }
  .gate { position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; background:rgba(5,6,10,0.4); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); pointer-events:auto; }
  .gate button { pointer-events:auto; padding:16px 30px; border-radius:16px; background:var(--panel); border:1px solid var(--panel-brd); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); color:var(--ink); font-family:inherit; font-size:15px; font-weight:700; letter-spacing:-0.01em; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .gate button .ic { width:20px; height:20px; }
  .gate button .ic path { stroke:currentColor; stroke-width:1.7; stroke-linecap:round; fill:none; }
  .gate small { display:block; font-family:ui-monospace,Menlo,monospace; font-weight:500; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-dim); margin-top:4px; }
  @media (max-width:480px){ .seg .lbl{font-size:11px;} .wordmark p{display:none;} }
</style>

<canvas id="orb"></canvas>

<div class="hud">
  <div class="wordmark"><h1><span class="dot"></span> Agent</h1><p>Voice visualiser</p></div>
  <div class="status"><div class="state" id="stateLabel">Idle</div><div class="hint" id="stateHint">Tap a state below</div></div>
  <div class="console">
    <div class="segmented" role="group" aria-label="Agent state">
      <button class="seg" data-state="idle" aria-pressed="true">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg><span class="lbl">Idle</span></button>
      <button class="seg" data-state="listening" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span class="lbl">Listening</span></button>
      <button class="seg" data-state="thinking" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg><span class="lbl">Thinking</span></button>
      <button class="seg" data-state="speaking" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24"><line x1="5" y1="9" x2="5" y2="15"/><line x1="9.5" y1="5" x2="9.5" y2="19"/><line x1="14.5" y1="7" x2="14.5" y2="17"/><line x1="19" y1="10" x2="19" y2="14"/></svg><span class="lbl">Speaking</span></button>
    </div>
    <div class="microw"><span class="micdot" id="micDot"></span><span id="micLabel">Microphone off · used only in Listening</span></div>
  </div>
</div>

<div class="gate" id="gate">
  <button id="gateBtn">
    <svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <span>Start visualiser<small>Enable sound &amp; motion</small></span>
  </button>
</div>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2  uCenter;   // marble centre, device px, y from bottom
uniform float uRadius;   // marble radius, device px
uniform float uTime;
uniform vec3  uColor;    // primary colour 0..1
uniform float uSwirl;    // swirl speed
uniform float uDrive;    // 0..1 audio energy

float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){
  vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                 mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                 mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s+=a*noise(p); p*=2.03; a*=0.5;} return s; }

void main(){
  vec2 d = (gl_FragCoord.xy - uCenter)/uRadius;   // 0 at centre, 1 at rim
  float rr = length(d);
  vec3 col = vec3(0.0);
  float alpha = 0.0;

  if(rr < 1.06){
    // ---- sphere geometry ----
    float rc = min(rr, 1.0);
    float z = sqrt(max(0.0, 1.0 - rc*rc));
    vec3 N = normalize(vec3(d, z));
    vec3 V = vec3(0.0, 0.0, 1.0);
    vec3 L = normalize(vec3(-0.5, 0.55, 0.75));

    // ---- smooth swirling glass ribbons (laminar vortex, not turbulent cloud) ----
    float tt = uTime*(0.10 + uSwirl*0.20)*(1.0 + uDrive*0.8);
    vec3 rd = refract(-V, N, 0.72);
    vec3 Pp = vec3(d, z*0.7) + rd*0.45;             // look a little way into the glass
    float ra = length(Pp.xy);
    float ang = atan(Pp.y, Pp.x) + ra*3.2 + tt;     // vortex twist (only inside cos/sin -> seamless)
    vec2 sw = vec2(cos(ang), sin(ang)) * ra;        // swirled, continuous coordinates
    vec3 Q  = vec3(sw, Pp.z*1.2 + tt*0.4);
    float w = fbm(Q*1.7);                            // smooth large-scale variation
    float bands = 0.5 + 0.5*sin((Q.x + Q.y)*6.0 + w*6.0);   // flowing ribbons (no seam)
    float v = clamp(mix(w, bands, 0.6), 0.0, 1.0);

    // ---- luminous colour bands (glass transmits light, so keep it bright) ----
    vec3 c1 = mix(uColor, vec3(0.03,0.08,0.34), 0.45);  // deeper blue, still luminous
    vec3 c2 = uColor;                                    // saturated core
    vec3 c3 = mix(uColor, vec3(1.0), 0.82);             // bright near-white
    vec3 ic = mix(c1, c2, smoothstep(0.0, 0.5, v));
    ic = mix(ic, c3, smoothstep(0.55, 0.95, v));

    // ---- gentle form shading — stays luminous, never black ----
    float diff = clamp(dot(N, L), 0.0, 1.0);
    col = ic * (0.78 + 0.5*diff);
    col *= mix(1.0, 0.7, smoothstep(0.85, 1.0, rc));    // thin seat at the very rim

    // ---- glossy reflections ----
    float refl = smoothstep(0.52, 0.0, length(d - vec2(-0.30, 0.34)));  // soft key reflection
    col += vec3(1.0) * refl * 0.55;
    vec3 H = normalize(L + V);
    float sp = pow(max(dot(N,H),0.0), 220.0) * 1.7;     // sharp wet hot-spot
    col += vec3(sp);
    float fres = pow(1.0 - max(dot(N,V),0.0), 2.4);     // bright refractive rim
    col += mix(uColor, vec3(1.0), 0.85) * fres * 0.85;
    float lens = smoothstep(0.6, 0.0, length(d - vec2(0.0, 0.5)));       // bottom lens
    col += mix(uColor, vec3(1.0), 0.7) * lens * (0.5 + uDrive*0.4) * z;

    float aa = smoothstep(1.0, 1.0 - 2.5/uRadius, rr);
    alpha = aa;
    col *= aa;
  }

  // ---- coloured halo cast outside the glass ----
  float halo = exp(-max(rr - 1.0, 0.0) * 3.2) * (0.16 + uDrive*0.22);
  vec3 haloCol = mix(uColor, vec3(1.0), 0.15);
  vec3 outCol = mix(haloCol, col, alpha);
  float outA  = max(alpha, halo);
  gl_FragColor = vec4(outCol, outA);
}
</script>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('orb');
  const gl = canvas.getContext('webgl', { alpha:true, premultipliedAlpha:false, antialias:true });

  // ---------- States (colour + behaviour of the inner pattern) ----------
  const STATES = {
    idle:      { name:'Idle',      hint:'Waiting for you',                          col:[5,55,255],    swirl:0.16, drive:0.0 },
    listening: { name:'Listening', hint:'Speak — the pattern reacts to your voice', col:[0,165,255],   swirl:0.34, drive:1.0 },
    thinking:  { name:'Thinking',  hint:'Processing',                               col:[150,40,255],  swirl:1.05, drive:0.0 },
    speaking:  { name:'Speaking',  hint:'Agent is responding',                      col:[0,220,160],   swirl:0.46, drive:0.85 }
  };
  let state='idle';
  const P = { col:[5,55,255], swirl:0.16, drive:0, level:0 };
  const lerp=(a,b,k)=>a+(b-a)*k;

  // ---------- WebGL setup ----------
  function compile(type, src){
    const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog=gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vert').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos=gl.getAttribLocation(prog,'aPos'); gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  const U = {
    center:gl.getUniformLocation(prog,'uCenter'),
    radius:gl.getUniformLocation(prog,'uRadius'),
    time:gl.getUniformLocation(prog,'uTime'),
    color:gl.getUniformLocation(prog,'uColor'),
    swirl:gl.getUniformLocation(prog,'uSwirl'),
    drive:gl.getUniformLocation(prog,'uDrive')
  };

  // ---------- Sizing ----------
  let dpr=1, cxDev=0, cyDev=0, radDev=0;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1, 2);
    const W=window.innerWidth, H=window.innerHeight;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    gl.viewport(0,0,canvas.width,canvas.height);
    const cx=W/2, cy=H/2 - Math.min(H*0.06,40);
    const baseR=Math.max(70, Math.min(W,H)*0.21);
    cxDev=cx*dpr; cyDev=canvas.height - cy*dpr; radDev=baseR*dpr;
    document.documentElement.style.setProperty('--orb-r', baseR+'px');
  }
  window.addEventListener('resize', resize); resize();

  // ---------- Audio (real microphone) ----------
  let audioCtx=null, analyser=null, timeData=null, micReady=false, micStream=null;
  const micDot=document.getElementById('micDot'), micLabel=document.getElementById('micLabel');
  async function enableMic(){
    if(micReady) return true;
    try{
      micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const src=audioCtx.createMediaStreamSource(micStream);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.82;
      src.connect(analyser); timeData=new Uint8Array(analyser.fftSize); micReady=true;
      micDot.classList.add('on'); micDot.classList.remove('err'); micLabel.textContent='Microphone live';
      return true;
    }catch(err){
      micDot.classList.add('err');
      micLabel.textContent=(location.protocol==='https:'||location.hostname==='localhost')
        ? 'Microphone blocked — allow access to react to voice'
        : 'Microphone needs https — open the hosted link';
      return false;
    }
  }
  function micLevel(){
    if(!micReady||!analyser) return 0;
    analyser.getByteTimeDomainData(timeData);
    let sum=0; for(let i=0;i<timeData.length;i++){const v=(timeData[i]-128)/128; sum+=v*v;}
    return Math.min(1, Math.sqrt(sum/timeData.length)*3.2);
  }

  // ---------- Simulated speaking envelope ----------
  let speakSeed=Math.random()*1000;
  function speakLevel(t){
    const syl=0.5+0.5*Math.sin(t*30+Math.sin(t*7)*2);
    const emph=0.55+0.45*Math.sin(t*3.3+speakSeed);
    const n=0.5+0.5*Math.sin((t*0.55+speakSeed*0.3)*6.28)+0.3*Math.sin((t*0.55)*15.1+1.7);
    const pause=n>0.35?1:Math.max(0.12,n/0.35);
    return Math.max(0, syl*emph*pause);
  }

  // ---------- Render loop ----------
  let t0=performance.now(), running=false;
  function frame(now){
    if(!running) return;
    const t=(now-t0)/1000;
    const S=STATES[state], k=0.06;
    for(let i=0;i<3;i++) P.col[i]=lerp(P.col[i],S.col[i],k);
    P.swirl=lerp(P.swirl,S.swirl,k);
    P.drive=lerp(P.drive,S.drive,k);
    let target=0;
    if(state==='listening') target=micLevel();
    else if(state==='speaking') target=speakLevel(t);
    P.level=lerp(P.level,target, target>P.level?0.35:0.12);
    const drive=P.level*P.drive;

    document.documentElement.style.setProperty('--live-col',
      `rgb(${P.col[0]|0},${P.col[1]|0},${P.col[2]|0})`);

    gl.uniform2f(U.center, cxDev, cyDev);
    gl.uniform1f(U.radius, radDev);
    gl.uniform1f(U.time, t);
    gl.uniform3f(U.color, P.col[0]/255, P.col[1]/255, P.col[2]/255);
    gl.uniform1f(U.swirl, P.swirl);
    gl.uniform1f(U.drive, drive);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }

  // ---------- State switching ----------
  const stateLabel=document.getElementById('stateLabel'), stateHint=document.getElementById('stateHint');
  const segs=[...document.querySelectorAll('.seg')];
  async function setState(next){
    state=next; const S=STATES[next];
    stateLabel.textContent=S.name; stateHint.textContent=S.hint;
    segs.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.state===next)));
    if(next==='speaking') speakSeed=Math.random()*1000;
    if(next==='listening'){
      const ok=await enableMic();
      if(ok && audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      if(!ok) stateHint.textContent=micLabel.textContent;
    }
  }
  segs.forEach(b=>b.addEventListener('click',()=>setState(b.dataset.state)));

  // ---------- Start gate ----------
  const gate=document.getElementById('gate');
  document.getElementById('gateBtn').addEventListener('click',()=>{
    gate.style.display='none'; running=true; t0=performance.now(); requestAnimationFrame(frame);
  });
  window.addEventListener('keydown',e=>{
    const map={'1':'idle','2':'listening','3':'thinking','4':'speaking'};
    if(map[e.key]) setState(map[e.key]);
  });
})();
</script>
